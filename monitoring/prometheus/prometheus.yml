global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: dev01-node-exporter
    static_configs:
      - targets: ["172.16.10.10:9100"]

  - job_name: dev01-cadvisor
    static_configs:
      - targets: ["172.16.10.10:8081"]
