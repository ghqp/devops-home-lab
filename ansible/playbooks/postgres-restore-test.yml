---
- name: Test a PostgreSQL backup without changing production
  hosts: dev
  become: true
  gather_facts: false

  tasks:
    - name: Test the restore while holding the shared lock
      block:
        - name: Take the shared backup lock
          ansible.builtin.include_role:
            name: postgres_backup
            tasks_from: lock.yml
          vars:
            postgres_backup_lock_action: acquire

        - name: Restore into a temporary database
          ansible.builtin.import_role:
            name: postgres_backup
            tasks_from: restore_test.yml
      always:
        - name: Release the shared backup lock
          ansible.builtin.include_role:
            name: postgres_backup
            tasks_from: lock.yml
          vars:
            postgres_backup_lock_action: release
