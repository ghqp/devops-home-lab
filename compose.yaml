services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: devops-home-lab/nginx:1.0
    container_name: dev01-nginx
    ports:
      - "8080:80"
    restart: unless-stopped
  database:
    image: postgres:17-alpine
    container_name: dev01-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
